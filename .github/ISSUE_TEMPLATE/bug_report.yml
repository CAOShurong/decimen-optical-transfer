name: Bug report
description: The CLI, camera, decoding, transfer, or recovered payload is wrong
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Screen-to-camera and terminal rendering vary across hardware, so the
        environment and settings fields below are the useful part — a report
        without them usually cannot be acted on.

        Before filing: if nothing decodes at all, lower the sender's frame bytes
        and FPS. In the browser, try 1465 bytes / 24 FPS. In the CLI, try
        `--frame-bytes 100 --fps 6`. Knowing whether that changes the result is
        itself worth reporting.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: dropdown
    id: symptom
    attributes:
      label: Symptom
      options:
        - Nothing ever decodes (progress bar never appears)
        - Decodes, but very slowly / stalls partway
        - Completes but fails its checksum
        - Camera won't start at all
        - Terminal CLI fails before displaying a QR
        - CLI QR displays, but the receiver never reads it
        - Packaging / installation problem
        - Something else
    validations:
      required: true

  - type: input
    id: receiver
    attributes:
      label: Receiving device (if applicable)
      description: Device model, OS version, browser and version. Write "not applicable" for a CLI-only failure.
      placeholder: iPhone 13 mini, iOS 18.5, Safari
    validations:
      required: true

  - type: input
    id: sender
    attributes:
      label: Sending environment
      description: Machine, OS, browser or terminal, Node version for the CLI, plus display size/scale/refresh rate when relevant.
      placeholder: Windows 11, Windows Terminal 1.23 at 100x32, Node 24 — 27-inch 60 Hz display
    validations:
      required: true

  - type: input
    id: sender-settings
    attributes:
      label: Sender settings or exact CLI command
      description: From the browser Transfer settings panel, or the complete `decimen` command with sensitive paths removed.
      placeholder: decimen send sample.bin --fps 8 --frame-bytes 160 --ecc L
    validations:
      required: true

  - type: input
    id: receiver-settings
    attributes:
      label: Receiver settings and negotiated camera (if applicable)
      description: >
        From the Receive settings panel, plus the "camera W×H @ N fps" line it
        prints underneath — that line is what the camera actually gave you,
        which is often not what was asked for.
      placeholder: capture width 1280 · capture fps 60 · 2 workers — camera 1280×960 @ 30 fps (asked 60)

  - type: textarea
    id: diagnostics
    attributes:
      label: Live diagnostics
      description: Expand "Live diagnostics" on the receiver and paste the numbers.
      placeholder: capture fps 58 · decode fps 12.4 · goodput 41.2 KB/s · frames new/dup 310/94 · blocks K 179

  - type: dropdown
    id: build
    attributes:
      label: Which build
      options:
        - Hosted site
        - Standalone decimen-receiver.html
        - Terminal CLI release package
        - Terminal CLI built from source
        - Local dev server (npm run dev)
    validations:
      required: true

  - type: input
    id: conditions
    attributes:
      label: Distance, lighting, and whether the phone was held or propped
      placeholder: ~40 cm, normal room light, propped against a mug
